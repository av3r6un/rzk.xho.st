name: CI and PR

on:
  push:
    branches-ignore: [master]

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  docker-build-and-test:
    name: Docker smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: rzk-ci
      SECRET_KEY: ci-only-secret-key-at-least-32-bytes
      INSTALL_FFMPEG: '0'
      HTTP_PORT: '18080'
      DEBUG: '1'
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          persist-credentials: false

      - name: Build and start Compose
        run: |
          docker compose build
          if docker compose up -d --no-build --wait --wait-timeout 90; then
            exit 0
          fi

          docker compose ps -a || true
          docker compose logs --no-color --tail=200 backend frontend || true
          backend_id=$(docker compose ps -a -q backend)
          if [[ -n "$backend_id" ]]; then
            docker inspect --format '{{json .State}}' "$backend_id" || true
          fi
          exit 1

      - name: Check backend and Nginx
        id: smoke
        run: |
          docker compose exec -T backend python -c 'import shutil, sys; assert sys.version_info >= (3, 14); assert shutil.which("ffmpeg") is None'
          docker compose exec -T backend python -m compileall -q src main.py
          docker compose exec -T backend alembic current --check-heads
          curl -fsS --retry 5 --retry-connrefused http://127.0.0.1:18080/ | grep -F 'id="app"'
          curl -fsS http://127.0.0.1:18080/health | jq -e '.body.ok == true'
          status=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/rezka/cookies)
          test "$status" = 401

      - name: Show service logs if HTTP checks fail
        if: failure() && steps.smoke.outcome == 'failure'
        run: docker compose logs --no-color

      - name: Stop Compose
        if: always()
        run: docker compose down

  create-and-merge-pr:
    needs: docker-build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency: auto-merge-${{ github.ref }}
    env:
      GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
      GH_REPO: ${{ github.repository }}
      HEAD_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          persist-credentials: false

      - name: Create PR and merge the tested commit
        run: |
          : "${GH_TOKEN:?Set the AUTOMATION_TOKEN repository secret}"
          remote_sha=$(gh api "repos/$GH_REPO/git/matching-refs/heads/$HEAD_BRANCH" | jq -r --arg ref "$GITHUB_REF" '.[] | select(.ref == $ref) | .object.sha')
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "Branch moved since this run started."
            exit 0
          fi

          pr=$(gh pr list --base master --head "$HEAD_BRANCH" --state open --json url --jq '.[0].url // ""')
          if [[ -z "$pr" ]]; then
            pr=$(gh pr create --base master --head "$HEAD_BRANCH" \
              --title "Merge $HEAD_BRANCH into master" \
              --body "Created automatically after the Docker smoke test passed.")
          fi
          pr_number=${pr##*/}
          gh api --method PUT "repos/$GH_REPO/pulls/$pr_number/merge" \
            -f merge_method=merge -f sha="$GITHUB_SHA"
